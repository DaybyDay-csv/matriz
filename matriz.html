<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matriz — pizarra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><g fill='white'><circle cx='32' cy='32' r='11'/><circle cx='68' cy='32' r='11' fill-opacity='.55'/><circle cx='32' cy='68' r='11' fill-opacity='.55'/><circle cx='68' cy='68' r='11' fill-opacity='.3'/></g></svg>">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#f0f3f8; --dot:#c9d3e0;
  --panel:#ffffff; --panel-2:#f7f9fc; --panel-3:#eef3f9;
  --line:#e4e9f0; --line-2:#cfd8e4;
  --text:#0f1729; --muted:#5a6675; --faint:#8f9cad;
  --accent:#2563eb; --accent-2:#dbeafe; --accent-3:#eef5ff;
  --card:#ffffff; --card-b:#dfe6ee;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 3px 8px rgba(16,24,40,.07);
  --shadow-lg:0 16px 40px rgba(16,24,40,.20), 0 3px 10px rgba(16,24,40,.10);
  --glass:rgba(255,255,255,.88);
  --rgn-done:rgba(148,163,184,.14); --rgn-matrix:rgba(37,99,235,.055); --rgn-sched:rgba(14,165,233,.11); --rgn-doing:rgba(22,163,74,.10); --rgn-top3:rgba(220,38,38,.05); --rgn-top3-b:rgba(220,38,38,.17);
  --ok:#0f9d58; --danger:#dc2626;
}
html[data-theme="dark"]{
  --bg:#080d15; --dot:#1d2837;
  --panel:#111a27; --panel-2:#0d1521; --panel-3:#182334;
  --line:#1e293b; --line-2:#2c3a4c;
  --text:#e9eff8; --muted:#93a3b8; --faint:#64748b;
  --accent:#60a5fa; --accent-2:#1e3a8a; --accent-3:#152541;
  --card:#17212f; --card-b:#27323f;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 18px 44px rgba(0,0,0,.6);
  --glass:rgba(17,26,39,.86);
  --rgn-done:rgba(148,163,184,.09); --rgn-matrix:rgba(96,165,250,.07); --rgn-sched:rgba(56,189,248,.10); --rgn-doing:rgba(52,211,153,.09); --rgn-top3:rgba(248,113,113,.065); --rgn-top3-b:rgba(248,113,113,.22);
}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= lienzo ================= */
#viewport{
  position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}

/* ---- zonas ---- */
.rgn{position:absolute;border-radius:28px;transition:background .15s,outline-color .15s}
.rgn.k-done{background:var(--rgn-done)}
.rgn.k-matrix{background:var(--rgn-matrix)}
.rgn.k-sched{background:var(--rgn-sched)}
.rgn.k-doing{background:var(--rgn-doing)}
.rgn.k-top3{background:var(--rgn-top3);box-shadow:inset 0 0 0 1.5px var(--rgn-top3-b)}
.rgn.k-top3 .rgn-name{color:var(--danger)}
html[data-theme="dark"] .rgn.k-top3 .rgn-name{color:#f58c8c}
.rgn.hot{outline:2px dashed var(--accent);outline-offset:6px}
.rgn-head{
  position:absolute;left:14px;top:-34px;display:flex;align-items:center;gap:7px;
  cursor:grab;user-select:none;padding:3px 6px;border-radius:9px;white-space:nowrap;
}
.rgn-head:hover{background:var(--panel);box-shadow:var(--shadow)}
.rgn-head:active{cursor:grabbing}
.rgn-name{font-size:14px;font-weight:650;letter-spacing:-.01em}
.rgn-n{font-size:11px;color:var(--muted);background:var(--panel-3);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.rgn-n.over{background:rgba(220,38,38,.13);color:var(--danger);font-weight:700}
.rgn-act{opacity:0;display:flex;gap:2px;transition:.12s}
.rgn-head:hover .rgn-act{opacity:1}
.rgn-act button{
  border:0;background:transparent;width:22px;height:22px;border-radius:6px;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;font-size:13px;padding:0;
}
.rgn-act button:hover{background:var(--panel-3);color:var(--text)}
.rgn-grip{
  position:absolute;right:-8px;bottom:-8px;width:20px;height:20px;border-radius:7px;cursor:nwse-resize;
  background:var(--panel);border:1.5px solid var(--line-2);opacity:.34;transition:.12s;
}
.rgn:hover .rgn-grip,.rgn-head:hover ~ .rgn-grip{opacity:1}
.rgn-grip:hover{border-color:var(--accent)}
.rgn-hint{
  position:absolute;left:12px;right:12px;bottom:18px;text-align:center;font-size:12px;color:var(--faint);
  pointer-events:none;opacity:.85;
}

/* ---- ejes de la matriz ---- */
.cross-v,.cross-h{position:absolute;background:var(--line-2);pointer-events:none}
.cross-v{left:50%;top:14px;bottom:14px;width:1.5px;margin-left:-.75px}
.cross-h{top:50%;left:14px;right:14px;height:1.5px;margin-top:-.75px}
.axl{position:absolute;font-size:12px;font-weight:650;color:var(--muted);white-space:nowrap;pointer-events:none}
.axl.t{left:50%;top:-25px;transform:translateX(-50%)}
.axl.b{left:50%;bottom:-25px;transform:translateX(-50%)}
.axl.l{right:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.axl.r{left:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.qn{position:absolute;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--qc);opacity:.62;pointer-events:none}
.qn i{font-style:normal;font-weight:600;letter-spacing:0;opacity:.85;margin-left:5px}
.qn.a{left:22px;top:16px;--qc:#c2410c}
.qn.b{right:22px;top:16px;--qc:#1d4ed8}
.qn.c{left:22px;bottom:16px;--qc:#a16207}
.qn.d{right:22px;bottom:16px;--qc:#64748b}
html[data-theme="dark"] .qn.a{--qc:#f0a58c} html[data-theme="dark"] .qn.b{--qc:#8fb6f5}
html[data-theme="dark"] .qn.c{--qc:#d9bd77} html[data-theme="dark"] .qn.d{--qc:#94a3b8}

/* ---- tarjetas ---- */
.card{
  position:absolute;width:210px;background:var(--card);border:1px solid var(--card-b);border-radius:11px;
  padding:8px 10px 8px 12px;box-shadow:var(--shadow);cursor:grab;user-select:none;
  transition:box-shadow .12s,border-color .12s,opacity .12s;
}
.card::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--pc,#94a3b8)}
.card:hover{border-color:var(--faint);box-shadow:var(--shadow-lg);z-index:6}
.card.drag{cursor:grabbing;box-shadow:var(--shadow-lg);rotate:.6deg;z-index:20;border-color:var(--accent)}
.card .t{font-size:13px;line-height:1.38;word-break:break-word;padding-right:18px}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.card .pj{display:inline-flex;align-items:center;gap:4px}
.card .pj i{width:6px;height:6px;border-radius:50%;background:var(--pc);display:block}
.card .badge{color:var(--faint)}
.card .badge.full{color:var(--ok);font-weight:600}
.card .date{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.card .date.late{color:var(--danger)}
.card .tick{
  position:absolute;right:7px;top:7px;width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--line-2);background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;opacity:0;transition:.12s;
}
.card:hover .tick,.card .tick.on{opacity:1}
.card .tick:hover{border-color:var(--ok)}
.card .tick svg{width:9px;height:9px;stroke:transparent;stroke-width:2.6;fill:none}
.card .tick:hover svg{stroke:var(--ok)}
.card.done{background:var(--panel-2);opacity:.85}
.card.done .t{color:var(--muted)}
.card.done .tick{opacity:1;background:var(--ok);border-color:var(--ok)}
.card.done .tick svg{stroke:#fff}
.card.doing{border-color:var(--accent)}
.card .badge.run{color:var(--accent);font-weight:600}
.card.today{border-color:rgba(220,38,38,.48)}
html[data-theme="dark"] .card.today{border-color:rgba(248,113,113,.45)}
.card .rank{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:0 5px;font-variant-numeric:tabular-nums}
.card .rank.over{background:var(--line-2);color:var(--muted)}
.card.dim{opacity:.14;filter:saturate(.15)}
.card.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-2),var(--shadow)}
.card.flash{animation:fl 1.1s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--accent-2),var(--shadow-lg)}100%{box-shadow:var(--shadow)}}
body.z-far .card .meta{display:none}
body.z-far .card{padding:9px 10px}

/* ================= barra flotante ================= */
.bar{
  position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;align-items:center;gap:12px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:0 10px;height:54px;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);position:relative}
.logo::before{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:#fff;
  box-shadow:10px 0 0 rgba(255,255,255,.62), 0 10px 0 rgba(255,255,255,.62), 10px 10px 0 rgba(255,255,255,.34)}
.brand-name{font-weight:650;font-size:13.5px;line-height:1.1}
.brand-date{font-size:11px;color:var(--muted);line-height:1.3}
.brand-date::first-letter{text-transform:uppercase}

.search-wrap{position:relative;flex:0 1 292px;display:flex;align-items:center}
.search-wrap>svg{position:absolute;left:10px;width:15px;height:15px;color:var(--faint);pointer-events:none}
#search{width:100%;padding:7px 84px 7px 31px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--panel-2);font-size:13px;outline:none;transition:.15s}
#search:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-3)}
.snav{position:absolute;right:6px;display:flex;align-items:center;gap:3px}
.snav b{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;margin-right:2px}
.snav button{border:0;background:var(--line);width:19px;height:19px;border-radius:6px;cursor:pointer;
  color:var(--muted);padding:0;display:grid;place-items:center;font-size:11px;line-height:1}
.snav button:hover{background:var(--line-2);color:var(--text)}

.chips{display:flex;gap:5px;overflow-x:auto;flex:1 1 auto;padding:2px 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;padding:4px 9px;
  border-radius:20px;border:1px solid var(--line-2);background:var(--panel-2);font-size:11.5px;color:var(--muted);transition:.12s}
.chip:hover{border-color:var(--faint)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--faint))}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .chip.on{color:#04101f}

.acts{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.btn{border:1px solid var(--line-2);background:var(--panel-2);padding:6px 11px;border-radius:9px;
  font-size:12.5px;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.icon{padding:6px 9px;line-height:1}
.btn.sm{padding:4px 8px;font-size:11.5px}
.saved{font-size:10.5px;color:var(--faint);white-space:nowrap}

.zoombar{
  position:fixed;right:14px;bottom:14px;z-index:50;display:flex;align-items:center;gap:2px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:4px;
}
.zoombar button{border:0;background:transparent;width:30px;height:28px;border-radius:8px;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;font-size:15px;padding:0}
.zoombar button:hover{background:var(--panel-3);color:var(--text)}
.zoombar .lvl{font-size:11.5px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.hintbar{
  position:fixed;left:14px;bottom:14px;z-index:50;font-size:11.5px;color:var(--faint);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:6px 11px;box-shadow:var(--shadow);
}
@media (max-width:900px){ .hintbar{display:none} }

/* ================= composer ================= */
.composer{
  position:fixed;z-index:70;background:var(--panel);border:1px solid var(--accent);border-radius:11px;
  box-shadow:var(--shadow-lg);padding:9px;width:238px;display:flex;flex-direction:column;gap:7px;
}
.composer input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:13px;
  background:var(--panel-2);outline:none}
.composer input:focus{border-color:var(--accent)}
.composer .row{display:flex;gap:6px;align-items:center}
.composer .hint{font-size:10.5px;color:var(--faint)}

/* ================= panel de detalle ================= */
.detail{position:fixed;right:0;top:0;bottom:0;width:372px;max-width:94vw;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:80;display:flex;flex-direction:column;
  animation:sl .16s ease}
@keyframes sl{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.detail header{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line)}
.detail header .zone{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:650}
.detail .body{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:15px}
.detail footer{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}
.iconbtn{border:1px solid transparent;background:transparent;width:26px;height:26px;border-radius:7px;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;font-size:16px;line-height:1;padding:0}
.iconbtn:hover{background:var(--panel-3);color:var(--text);border-color:var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.field input,.field textarea{border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:13px;
  background:var(--panel-2);outline:none;width:100%;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-3)}
#dTitle{font-size:15px;font-weight:600;line-height:1.4;min-height:54px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel-2);padding:7px 4px;font-size:12px;cursor:pointer;
  color:var(--muted);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel-3)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .seg button.on{color:#04101f}
.subs{display:flex;flex-direction:column;gap:3px}
.sub{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px}
.sub:hover{background:var(--panel-2)}
.sub input[type=checkbox]{width:15px;height:15px;accent-color:var(--ok);flex:0 0 auto;margin:0;cursor:pointer}
.sub span{flex:1;font-size:13px;line-height:1.35;word-break:break-word;cursor:text;outline:none}
.sub.ok span{text-decoration:line-through;color:var(--faint)}
.sub .del{opacity:0;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:14px;padding:0 3px}
.sub:hover .del{opacity:1}
.sub .del:hover{color:var(--danger)}
.progbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
.progbar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .2s}
.cal-row{display:flex;gap:7px}
.danger{color:var(--danger);border-color:transparent;background:transparent}
.danger:hover{background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.3)}

/* ================= varios ================= */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:120;background:var(--text);
  color:var(--bg);padding:9px 13px;border-radius:10px;font-size:12.5px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-lg);animation:up .18s ease}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast button{border:0;background:transparent;color:#8ab4ff;font-weight:650;cursor:pointer;font-size:12.5px}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:grid;place-items:center;padding:22px}
.sheet{background:var(--panel);border-radius:15px;box-shadow:var(--shadow-lg);max-width:620px;width:100%;max-height:86vh;overflow:auto}
.sheet .h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .h h3{margin:0;font-size:15px}
.sheet .c{padding:18px;font-size:13.5px;line-height:1.65;color:var(--muted)}
.sheet .c h4{color:var(--text);margin:18px 0 6px;font-size:13px}
.sheet .c h4:first-child{margin-top:0}
.sheet .c kbd{background:var(--panel-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-size:11.5px;font-family:inherit;color:var(--text)}
.sheet .c ul{margin:6px 0;padding-left:18px}
.sheet .c li{margin:3px 0}
.menu{position:fixed;right:12px;top:72px;z-index:100;background:var(--panel);border:1px solid var(--line-2);
  border-radius:11px;box-shadow:var(--shadow-lg);padding:5px;min-width:216px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;text-align:left;
  padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.menu button:hover{background:var(--panel-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.warn{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:60;background:#fef3c7;color:#78350f;
  padding:7px 14px;font-size:12px;border-radius:9px;box-shadow:var(--shadow)}
@media (max-width:1080px){ .chips{display:none} }
</style>
</head>
<body>

<div id="viewport"><div id="world"></div></div>

<div class="bar">
  <div class="brand">
    <div class="logo"></div>
    <div>
      <div class="brand-name">Matriz</div>
      <div class="brand-date" id="today"></div>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="search" type="text" placeholder="Buscar en todo" spellcheck="false" autocomplete="off">
    <div class="snav" id="snav" hidden>
      <b id="sCount"></b>
      <button id="sPrev" title="Anterior">‹</button>
      <button id="sNext" title="Siguiente (Enter)">›</button>
      <button id="sClear" title="Limpiar">×</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="acts">
    <span class="saved" id="savedAt"></span>
    <button class="btn btn-primary" id="btnNew">+ Nueva</button>
    <button class="btn icon" id="btnTheme" title="Tema claro / oscuro">◐</button>

function baseRegions() {
  return [
    { id:"r-done",   kind:"done",   name:"Hecho",             x:0,    y:130,  w:252, h:760 },
    { id:"r-doing",  kind:"doing",  name:"En ejecución",      x:342,  y:-100, w:880, h:170 },
    { id:"r-top3",   kind:"top3",   name:"3 prioridades hoy", x:342,  y:-330, w:880, h:170 },
    { id:"r-matrix", kind:"matrix", name:"Matriz",            x:342,  y:130,  w:880, h:760 },
    { id:"r-sched",  kind:"sched",  name:"Programado",        x:1312, y:130,  w:252, h:760 }
  ];
}
function seed() {
  const es = lang === "es";
  const P = (es
    ? [["Trabajo","#2563eb"],["Cliente","#d946ef"],["Personal","#059669"]]
    : [["Work","#2563eb"],["Client","#d946ef"],["Personal","#059669"]]
  ).map(([name,color]) => ({ name, color }));
  const R = baseRegions(), D = R.find(r => r.kind === "done"), M = R.find(r => r.kind === "matrix"), G = R.find(r => r.kind === "sched");
  const proj = P.map(p => p.name);
  const mk = (title, project, wx, wy, extra) => Object.assign({
    id: uid(), title, project, notes:"", subtasks:[], date:"", time:"",
    wx, wy, zone:"free", createdAt: Date.now(), doneAt:null }, extra || {});

  const mat = (es ? [
    ["Terminar la propuesta del trimestre", proj[0], .13,.07],["Rediseñar la web", proj[0], .14,.17],
    ["Llamar a tres proveedores", proj[1], .10,.28],["Revisar las cuentas del mes", proj[2], .14,.38],
    ["Preparar la campaña de otoño", proj[0], .62,.16],["Ordenar el archivo de facturas", proj[0], .64,.27],
    ["Curso de idiomas · unidad 4", proj[2], .64,.38]
  ] : [
    ["Finish the quarterly proposal", proj[0], .13,.07],["Redesign the website", proj[0], .14,.17],
    ["Follow up with three suppliers", proj[1], .10,.28],["Review this month's numbers", proj[2], .14,.38],
    ["Plan the autumn campaign", proj[0], .62,.16],["Tidy up the invoice archive", proj[0], .64,.27],
    ["Language course · unit 4", proj[2], .64,.38]
  ]).map(([t,p,fx,fy]) => mk(t, p, Math.round(M.x + fx*M.w - CARD_W/2), Math.round(M.y + fy*M.h - 26), { zone:"matrix" }));

  const done = (es ? [
    ["Enviar el informe mensual", proj[0]],["Preparar la reunión del lunes", proj[0]]
  ] : [
    ["Send the monthly report", proj[0]],["Prep Monday's meeting", proj[0]]
  ]).map(([t,p], i) => mk(t, p, D.x + 28, D.y + 24 + i*64, { zone:"done" }));

  const d5 = new Date(Date.now() + 5*864e5);
  const in5 = d5.getFullYear() + "-" + String(d5.getMonth()+1).padStart(2,"0") + "-" + String(d5.getDate()).padStart(2,"0");
  const sched = [ mk(es ? "Demo con el cliente" : "Demo with the client", proj[1], G.x + 32, G.y + 24, { zone:"sched", date:in5 }) ];

  return { v:2, theme:"light", view:null, lang, projects:P, regions:R, tasks:[...mat, ...done, ...sched] };
}

/* ------------------ migración desde la versión de columnas -------------- */
function migrate(old) {
  const R = baseRegions(), D = R.find(r => r.kind === "done"), M = R.find(r => r.kind === "matrix"), G = R.find(r => r.kind === "sched");
  let di = 0, gi = 0;
  const tasks = (old.tasks || []).map(t => {
    const n = { id: t.id || uid(), title: t.title, project: t.project || "", notes: t.notes || "",
                subtasks: t.subtasks || [], date: t.date || "", time: t.time || "",
                createdAt: t.createdAt || Date.now(), doneAt: t.doneAt || null,
                zone: t.zone === "done" ? "done" : t.zone === "sched" ? "sched" : "matrix", wx:0, wy:0 };
    if (n.zone === "done")       { n.wx = D.x + 28; n.wy = D.y + 24 + (di++) * 64; }
    else if (n.zone === "sched") { n.wx = G.x + 32; n.wy = G.y + 24 + (gi++) * 64; }
    else { n.wx = Math.round(M.x + (t.x != null ? t.x : .25) * M.w - CARD_W/2);
           n.wy = Math.round(M.y + (t.y != null ? t.y : .25) * M.h - 26); }
    return n;
  });
  return { v:2, theme: old.theme || "light", view:null, projects: old.projects || [], regions:R,
           tasks, lastExport: old.lastExport || null };
}

/* ------------------------------ guardado -------------------------------- */
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.tasks)) return d; }
    const o = localStorage.getItem(OLD);
    if (o) { const p = JSON.parse(o); if (p && Array.isArray(p.tasks)) return migrate(p); }
    return null;
  } catch (e) { storageOK = false; return null; }
}
let saveT = null;
function save(now) {
  clearTimeout(saveT);
  const go = () => {
    try {
      S.view = { x: view.x, y: view.y, k: view.k };
      localStorage.setItem(KEY, JSON.stringify(S));
      const d = new Date();
      $("#savedAt").textContent = T("saved") + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    } catch (e) { storageOK = false; $("#savedAt").textContent = T("notSaved"); $("#savedAt").style.color = "var(--danger)"; }
  };
  now ? go() : (saveT = setTimeout(go, 200));
}

/* completa las zonas de fábrica que falten (p. ej. "En ejecución" en tableros
   anteriores), conservando la posición que tuvieran las ya existentes */
function ensureRegions(regions) {
  regions = regions || [];
  const R = baseRegions(), M = regions.find(r => r.kind === "matrix"), D = regions.find(r => r.kind === "doing");
  return R.map(b => {
    const f = regions.find(r => r.kind === b.kind);
    if (f) return f;
    const n = Object.assign({}, b);
    if (n.kind === "doing" && M) { n.x = M.x; n.w = M.w; n.y = M.y - 230; }
    if (n.kind === "top3") {
      if (D) { n.x = D.x; n.w = D.w; n.y = D.y - 230; }
      else if (M) { n.x = M.x; n.w = M.w; n.y = M.y - 460; }
    }
    return n;
  });
}
let S = load() || seed();
S.projects = S.projects || [];
S.regions = ensureRegions(S.regions);
S.tasks.forEach(t => { t.subtasks = t.subtasks || []; t.notes = t.notes || ""; });
if (S.lang) lang = S.lang === "en" ? "en" : "es";
S.lang = lang;

const view = Object.assign({ x:0, y:0, k:1 }, S.view || {});
let q = "", pfilter = null, openId = null, hitList = [], hitIx = -1;

const getTask = id => S.tasks.find(t => t.id === id);
const getRgn  = id => S.regions.find(r => r.id === id);
const projColor = n => (S.projects.find(p => p.name === n) || {}).color || "#94a3b8";
function ensureProject(name) {
  name = (name || "").trim(); if (!name) return "";
  const f = S.projects.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (f) return f.name;
  S.projects.push({ name, color: PALETTE[S.projects.length % PALETTE.length] });
  return name;
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function matches(t) {
  if (pfilter && t.project !== pfilter) return false;
  if (!q) return true;
  const hay = norm([t.title, t.project, t.notes, (t.subtasks||[]).map(s=>s.text).join(" "), t.date].join(" "));
  return norm(q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
/* --------------------------- vista: mover y zoom ------------------------ */
world.innerHTML = '<div id="layerR" style="position:absolute;left:0;top:0"></div>' +
                  '<div id="layerC" style="position:absolute;left:0;top:0"></div>';
const layerR = $("#layerR"), layerC = $("#layerC");

function applyView() {
  world.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.k + ")";
  vp.style.backgroundSize = (26 * view.k) + "px " + (26 * view.k) + "px";
  vp.style.backgroundPosition = view.x + "px " + view.y + "px";
  $("#zLvl").textContent = Math.round(view.k * 100) + "%";
  document.body.classList.toggle("z-far", view.k < .55);
}
const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.k, y: (sy - view.y) / view.k });
function zoomAt(sx, sy, k) {
  k = clamp(k, .2, 2.6);
  const w = toWorld(sx, sy);
  view.k = k; view.x = sx - w.x * k; view.y = sy - w.y * k;
  applyView(); save();
}
function contentBox() {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  S.regions.forEach(r => { a = Math.min(a, r.x); b = Math.min(b, r.y - 40); c = Math.max(c, r.x + r.w); d = Math.max(d, r.y + r.h); });
  S.tasks.forEach(t => { a = Math.min(a, t.wx); b = Math.min(b, t.wy); c = Math.max(c, t.wx + CARD_W); d = Math.max(d, t.wy + 70); });
  if (!isFinite(a)) return { x:0, y:0, w:1000, h:700 };
  return { x:a, y:b, w:c - a, h:d - b };
}
function fitView(animate) {

/* ------------------------------ fechas ---------------------------------- */
const MES = { es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],

  return d + " " + mes(m-1) + (y === new Date().getFullYear() ? "" : " " + String(y).slice(2));
}
const fmtDay = ts => { const d = new Date(ts); return d.getDate() + " " + mes(d.getMonth()); };

/* ------------------------------ zonas ----------------------------------- */
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

/* zona = dónde cae el centro de la tarjeta */

  $$(".card", layerC).forEach(el => {
    const t = getTask(el.dataset.id); if (!t) return;
    const z = zoneAt(t.wx + el.offsetWidth/2, t.wy + el.offsetHeight/2);
    if (z === t.zone) return;
    if (z === "done") t.doneAt = Date.now(); else t.doneAt = null;

  });
  if (changed) {
    S.tasks.forEach(t => { const el = $('.card[data-id="' + t.id + '"]', layerC); if (el) redrawCard(t); });
    renderRegions();

  }

}

/* ===================== gestos: mover, arrastrar, estirar ================= */
let G = null, spaceDown = false;

function hotRegion(kind) {
  $$(".rgn", layerR).forEach(n => n.classList.toggle("hot", !!kind && n.classList.contains("k-" + kind)));
}
vp.addEventListener("contextmenu", e => e.preventDefault());
vp.addEventListener("pointerdown", e => {
  if (e.button === 1 || (e.button === 0 && spaceDown)) return startPan(e);
  if (e.button !== 0) return;
  if (e.target.closest("[data-tick],.rgn-act button,.composer")) return;
  const grip = e.target.closest("[data-grip]");
  const head = e.target.closest("[data-rhead]");
  const card = e.target.closest(".card");
  if (grip)      startRgnSize(e, grip.dataset.grip);

  vp.classList.add("panning");
}
function startCard(e, el) {
  const t = getTask(el.dataset.id); if (!t) return;
  capture(e);
  const w = toWorld(e.clientX, e.clientY);
  G = { m:"card", pid:e.pointerId, id:t.id, el, dx:w.x - t.wx, dy:w.y - t.wy, sx:e.clientX, sy:e.clientY, moved:false };
}
function startRgnMove(e, id) {
  const r = getRgn(id); if (!r) return;
  capture(e);
  const w = toWorld(e.clientX, e.clientY);
  const inside = S.tasks.filter(t => inRect(t.wx + CARD_W/2, t.wy + 28, r)).map(t => ({ t, dx:t.wx - r.x, dy:t.wy - r.y }));
  G = { m:"rgn", pid:e.pointerId, r, el:$('[data-rgn="' + id + '"]', layerR), dx:w.x - r.x, dy:w.y - r.y, inside, moved:false };
}
function startRgnSize(e, id) {
  const r = getRgn(id); if (!r) return;
  capture(e);
  const w = toWorld(e.clientX, e.clientY);
  G = { m:"size", pid:e.pointerId, r, el:$('[data-rgn="' + id + '"]', layerR), dw:w.x - r.w, dh:w.y - r.h, moved:false };
}

vp.addEventListener("pointermove", e => {
  if (!G || e.pointerId !== G.pid) return;
  if (!G.moved && G.m !== "pan" && Math.abs(e.clientX - (G.sx || e.clientX)) + Math.abs(e.clientY - (G.sy || e.clientY)) < 4
      && (G.m === "card")) return;
  const w = toWorld(e.clientX, e.clientY);

  if (G.m === "pan") {
    view.x = G.x0 + (e.clientX - G.sx); view.y = G.y0 + (e.clientY - G.sy);
    if (Math.abs(e.clientX - G.sx) + Math.abs(e.clientY - G.sy) > 3) G.moved = true;
    applyView();
  } else if (G.m === "card") {
    const t = getTask(G.id); if (!t) return;
    if (!G.moved) {
      G.moved = true; G.el.classList.add("drag");
      if (!$("#detail").hidden) closeDetail();
      if (!edgeRAF) edgeRAF = requestAnimationFrame(edgeLoop);
    }
    lastPt.x = e.clientX; lastPt.y = e.clientY;
    t.wx = Math.round(w.x - G.dx); t.wy = Math.round(w.y - G.dy);
    G.el.style.left = t.wx + "px"; G.el.style.top = t.wy + "px";
    hotRegion(zoneAt(t.wx + G.el.offsetWidth/2, t.wy + G.el.offsetHeight/2));
  } else if (G.m === "rgn") {
    G.moved = true;
    G.r.x = Math.round(w.x - G.dx); G.r.y = Math.round(w.y - G.dy);
    G.el.style.left = G.r.x + "px"; G.el.style.top = G.r.y + "px";
    G.inside.forEach(o => {
      o.t.wx = G.r.x + o.dx; o.t.wy = G.r.y + o.dy;
      const c = $('.card[data-id="' + o.t.id + '"]', layerC);
      if (c) { c.style.left = o.t.wx + "px"; c.style.top = o.t.wy + "px"; }
    });
  } else if (G.m === "size") {
    G.moved = true;
    G.r.w = Math.round(clamp(w.x - G.dw, 190, 6000));
    G.r.h = Math.round(clamp(w.y - G.dh, 160, 6000));
    G.el.style.width = G.r.w + "px"; G.el.style.height = G.r.h + "px";

/* si arrastras una tarjeta hasta el borde, el lienzo se desplaza solo */
let edgeRAF = null, lastPt = { x:0, y:0 };
function edgeLoop() {
  if (!G || G.m !== "card" || !G.moved) { edgeRAF = null; return; }
  const M = 60, SP = 13, topM = M + 60;
  let dx = 0, dy = 0;
  if (lastPt.x < M) dx = (M - lastPt.x) / M * SP;
  else if (lastPt.x > innerWidth - M) dx = -(lastPt.x - (innerWidth - M)) / M * SP;
  if (lastPt.y < topM) dy = (topM - lastPt.y) / M * SP;
  else if (lastPt.y > innerHeight - M) dy = -(lastPt.y - (innerHeight - M)) / M * SP;
  if (dx || dy) {
    view.x += dx; view.y += dy; applyView();
    const t = getTask(G.id), w = toWorld(lastPt.x, lastPt.y);
    if (t) {
      t.wx = Math.round(w.x - G.dx); t.wy = Math.round(w.y - G.dy);
      G.el.style.left = t.wx + "px"; G.el.style.top = t.wy + "px";
      hotRegion(zoneAt(t.wx + G.el.offsetWidth/2, t.wy + G.el.offsetHeight/2));

function endGesture(e, cancel) {
  if (!G) return;

  vp.classList.remove("panning");
  hotRegion(null);
  if (g.m === "pan") {
    if (!g.moved) { closeComposer(); if (!$("#detail").hidden) closeDetail(); } else seenHint();
    save(); return;
  }
  if (g.m === "card") {
    g.el.classList.remove("drag");
    if (!g.moved) { if (!cancel) openDetail(g.id); return; }
    const t = getTask(g.id);
    seenHint();
    refreshZones(); redrawCard(t); redrawZone("top3"); renderRegions(); save(); flash(t.id);
    if (openId === t.id) openDetail(t.id);
    return;
  }
  if (g.m === "rgn" || g.m === "size") { refreshZones(); renderRegions(); save(); }
}
vp.addEventListener("pointerup", e => endGesture(e, false));
vp.addEventListener("pointercancel", e => endGesture(e, true));

/* rueda: desplazar; ⌘/Ctrl + rueda: zoom */
vp.addEventListener("wheel", e => {
  e.preventDefault();
  seenHint();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, view.k * Math.exp(-e.deltaY * .012));
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); save(); }
}, { passive:false });

function seenHint() {

}
/* botones de zoom */
$("#zIn").addEventListener("click", () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, view.k * 1.25));
$("#zOut").addEventListener("click", () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, view.k / 1.25));

/* marcar hecho / sacar de hecho */

/* acciones de la cabecera de zona */

/* ------------------------- colocar dentro de una zona ------------------- */
function placeIn(t, kind) {
  const r = S.regions.find(x => x.kind === kind); if (!r) return;
  if (t.zone === "matrix" && kind !== "matrix") t.lastMatrix = { wx:t.wx, wy:t.wy };
  if (kind === "matrix") {
    if (t.lastMatrix && inRect(t.lastMatrix.wx + CARD_W/2, t.lastMatrix.wy + 28, r)) { t.wx = t.lastMatrix.wx; t.wy = t.lastMatrix.wy; }
    else { t.wx = Math.round(r.x + r.w/2 - CARD_W/2); t.wy = Math.round(r.y + r.h*.3); }
  } else {
    const inside = S.tasks.filter(o => o.id !== t.id && o.zone === kind);
    t.wx = Math.round(r.x + Math.max(14, (r.w - CARD_W)/2));
    t.wy = inside.length ? Math.max(...inside.map(o => o.wy)) + 64 : r.y + 24;
    if (t.wy + 64 > r.y + r.h) r.h = t.wy + 64 - r.y;
  }
  t.zone = kind;
  t.doneAt = kind === "done" ? Date.now() : null;

/* ------------------------------ ordenar --------------------------------- */
function tidyRegion(id) {
  const r = getRgn(id); if (!r) return;
  const H = {};
  $$(".card", layerC).forEach(c => H[c.dataset.id] = c.offsetHeight);
  const items = S.tasks.filter(t => t.zone === r.kind);
  const GAP = 10, PAD = 18;
  const packer = (list, x0, y0, w, h) => {
    const cols = Math.max(1, Math.floor((w - PAD) / (CARD_W + GAP)));
    const colY = new Array(cols).fill(y0 + PAD);
    const out = [];
    list.forEach(t => {
      const hh = H[t.id] || 56;
      let k = 0; for (let i = 1; i < cols; i++) if (colY[i] < colY[k]) k = i;
      out.push({ t, x: x0 + PAD + k * (CARD_W + GAP), y: colY[k] });
      colY[k] += hh + GAP;
    });
    const used = Math.max.apply(null, colY.concat([y0])) - y0 - PAD;
    return { out, used, room: h - PAD*2 };
  };
  if (r.kind === "matrix") {
    [[0,0],[.5,0],[0,.5],[.5,.5]].forEach(([qx, qy]) => {
      const list = items.filter(t => {
        const cx = t.wx + CARD_W/2, cy = t.wy + 28;
        return ((cx < r.x + r.w/2) ? 0 : .5) === qx && ((cy < r.y + r.h/2) ? 0 : .5) === qy;
      }).sort((a,b) => a.wy - b.wy || a.wx - b.wx);
      if (!list.length) return;
      const p = packer(list, r.x + qx*r.w, r.y + qy*r.h, r.w/2, r.h/2);
      const sc = p.used > p.room && p.used > 0 ? p.room / p.used : 1;
      p.out.forEach(o => { o.t.wx = Math.round(o.x); o.t.wy = Math.round(r.y + qy*r.h + PAD + (o.y - r.y - qy*r.h - PAD) * sc); });
    });
  } else {
    const list = items.slice().sort(r.kind === "done"
      ? (a,b) => (b.doneAt || 0) - (a.doneAt || 0) || a.wy - b.wy
      : r.kind === "sched"
      ? (a,b) => (a.date || "9999").localeCompare(b.date || "9999") || a.wy - b.wy
      : r.kind === "top3"
      ? (a,b) => a.wx - b.wx || a.wy - b.wy
      : (a,b) => a.wy - b.wy);
    const p = packer(list, r.x, r.y, r.w, r.h);
    p.out.forEach(o => { o.t.wx = Math.round(o.x); o.t.wy = Math.round(o.y); });
    if (p.used + PAD*2 > r.h) r.h = Math.round(p.used + PAD*2);   // la zona crece si hace falta
  }
  renderRegions(); renderCards(); refreshZones(); save();
}
function archiveDone() {
  const gone = S.tasks.filter(t => t.zone === "done");
  if (!gone.length) return toast(T("nothingDone"));
  if (!confirm(T("archiveConfirm", gone.length))) return;
  S.tasks = S.tasks.filter(t => t.zone !== "done");
  render(); save();
  toast(T("archived", gone.length), T("undo"), () => { S.tasks.push(...gone); render(); save(); });
}

                zone: "free", createdAt: Date.now(), doneAt: null };

/* si la tarjeta queda detrás del panel, el lienzo se aparta lo justo */
function ensureVisible(t) {
  const el = $('.card[data-id="' + t.id + '"]', layerC); if (!el) return;
  const r = el.getBoundingClientRect(), limit = innerWidth - 372 - 18;
  let dx = 0, dy = 0;
  if (r.right > limit) dx = limit - r.right;
  if (r.left + dx < 18) dx = 18 - r.left;
  if (r.top < 78) dy = 78 - r.top;
  else if (r.bottom > innerHeight - 18) dy = (innerHeight - 18) - r.bottom;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) goTo(view.x + dx, view.y + dy, view.k, true);
}
function removeTask(id) {
  const i = S.tasks.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = S.tasks.splice(i, 1);
  closeDetail(); render(); save();
  toast(T("taskDeleted"), T("undo"), () => { S.tasks.push(t); render(); save(); flash(t.id); });
}

/* -------------------------------- toast --------------------------------- */
let toastT = null;
function toast(msg, label, action) {
  const old = $(".toast"); if (old) old.remove();
  clearTimeout(toastT);
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = "<span>" + esc(msg) + "</span>";
  if (label) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { action && action(); el.remove(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  toastT = setTimeout(() => el.remove(), 6000);
}

/* ------------------------------ calendario ------------------------------ */
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Madrid";
function calRange(t) {
  const [y, m, d] = (t.date || todayISO()).split("-").map(Number);
  if (t.time) {
    const [h, mi] = t.time.split(":").map(Number);
    const s = new Date(y, m-1, d, h, mi, 0), e = new Date(s.getTime() + 3600e3);
    const f = x => x.getFullYear() + pad(x.getMonth()+1) + pad(x.getDate()) + "T" + pad(x.getHours()) + pad(x.getMinutes()) + "00";
    return { start:f(s), end:f(e), allDay:false };
  }
  const s = new Date(y, m-1, d), e = new Date(y, m-1, d+1);
  const f = x => x.getFullYear() + pad(x.getMonth()+1) + pad(x.getDate());
  return { start:f(s), end:f(e), allDay:true };
}
function calDetails(t) {
  const p = [];
  if (t.project) p.push(T("projectPrefix") + t.project);
  if ((t.notes || "").trim()) p.push(t.notes.trim());
  if ((t.subtasks || []).length) p.push(t.subtasks.map(s => (s.done ? "☑ " : "☐ ") + s.text).join("\n"));
  return p.join("\n\n");
}
function gcalUrl(t) {
  const r = calRange(t);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action:"TEMPLATE", text:t.title, dates:r.start + "/" + r.end, details:calDetails(t), ctz:TZ }).toString();
}
function outlookUrl(t) {
  const date = t.date || todayISO();
  const p = { path:"/calendar/action/compose", rru:"addevent", subject:t.title, body:calDetails(t) };
  if (t.time) {
    const [h, mi] = t.time.split(":").map(Number);
    const [y, m, dd] = date.split("-").map(Number);
    const s = new Date(y, m-1, dd, h, mi), e = new Date(s.getTime() + 3600e3);
    const f = x => x.getFullYear() + "-" + pad(x.getMonth()+1) + "-" + pad(x.getDate()) + "T" + pad(x.getHours()) + ":" + pad(x.getMinutes()) + ":00";
    p.startdt = f(s); p.enddt = f(e);
  } else {
    const [y, m, dd] = date.split("-").map(Number);
    const e = new Date(y, m-1, dd+1);
    p.startdt = date; p.enddt = e.getFullYear() + "-" + pad(e.getMonth()+1) + "-" + pad(e.getDate()); p.allday = "true";
  }
  return "https://outlook.live.com/calendar/0/deeplink/compose?" + new URLSearchParams(p).toString();
}
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function buildIcs(list) {
  const n = new Date();
  const stamp = n.getUTCFullYear() + pad(n.getUTCMonth()+1) + pad(n.getUTCDate()) + "T" +
                pad(n.getUTCHours()) + pad(n.getUTCMinutes()) + pad(n.getUTCSeconds()) + "Z";
  const ev = list.map(t => {
    const r = calRange(t);
    return ["BEGIN:VEVENT","UID:" + t.id + "@matriz","DTSTAMP:" + stamp,
      r.allDay ? "DTSTART;VALUE=DATE:" + r.start : "DTSTART:" + r.start,
      r.allDay ? "DTEND;VALUE=DATE:" + r.end : "DTEND:" + r.end,
      "SUMMARY:" + icsEsc(t.title), "DESCRIPTION:" + icsEsc(calDetails(t)), "END:VEVENT"].join("\r\n");
  }).join("\r\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Matriz//ES","CALSCALE:GREGORIAN", ev, "END:VCALENDAR"].join("\r\n");
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadIcs(list, base) {
  const ok = list.filter(t => t.date);
  if (!ok.length) return toast(T("noDateTasks"));
  download("matriz-" + base + ".ics", buildIcs(ok), "text/calendar;charset=utf-8");
}
function exportJson() {
  S.lastExport = Date.now(); save(true);
  download("matriz-" + todayISO() + ".json", JSON.stringify(S, null, 2), "application/json");
}

/* --------------------------------- menú --------------------------------- */
function closeMenu() { const m = $(".menu"); if (m) m.remove(); }
$("#btnMenu").addEventListener("click", e => {
  e.stopPropagation();
  if ($(".menu")) return closeMenu();
  const m = document.createElement("div");
  m.className = "menu";
  m.innerHTML =
    '<button data-a="tidy">' + esc(T("menuTidy")) + '</button>' +
    '<button data-a="fit">' + esc(T("menuFit")) + '</button>' +
    '<button data-a="reset">' + esc(T("menuReset")) + '</button><hr>' +

$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      let d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.tasks)) throw 0;
      if (!confirm(T("importConfirm", S.tasks.length))) return;
      if (d.v !== 2) d = migrate(d);
      S = d; S.projects = S.projects || []; S.regions = ensureRegions(S.regions);
      S.tasks.forEach(t => { t.subtasks = t.subtasks || []; t.notes = t.notes || ""; });
      S.lang = lang;
      render(); save(true); fitView(true); toast(T("imported"));
    } catch (_) { toast(T("importBad")); }
  };
  rd.readAsText(f); e.target.value = "";
});

/* ------------------------------- teclado -------------------------------- */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === " " && !typing) { spaceDown = true; vp.style.cursor = "grab"; }
  if (e.key === "Escape") {
    if (composer) return closeComposer();
    if (e.target === $("#search")) { q = ""; e.target.value = ""; render(); e.target.blur(); return; }
    if (!$("#detail").hidden) return closeDetail();
    closeMenu(); const bd = $(".backdrop"); if (bd) bd.remove();
    return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); $("#search").focus(); $("#search").select(); }
  if (e.key === "n" || e.key === "N") { e.preventDefault(); $("#btnNew").click(); }
  if (e.key === "0") { e.preventDefault(); fitView(true); }
  if (e.key === "+" || e.key === "=") zoomAt(vp.clientWidth/2, vp.clientHeight/2, view.k * 1.25);
  if (e.key === "-") zoomAt(vp.clientWidth/2, vp.clientHeight/2, view.k / 1.25);
});
document.addEventListener("keyup", e => { if (e.key === " ") { spaceDown = false; vp.style.cursor = ""; } });
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".menu,#btnMenu")) closeMenu();
  if (composer && !e.target.closest(".composer")) closeComposer();
  if (!$("#detail").hidden && !e.target.closest("#detail,.card,.backdrop,.toast,.menu,.bar")) closeDetail();
}, true);
window.addEventListener("beforeunload", () => save(true));

/* --------------------------------- init --------------------------------- */
(function init() {
  document.documentElement.dataset.theme = S.theme === "dark" ? "dark" : "light";
  if (S.seenHint) $("#hintbar").remove();
  applyLang();
  render();
  S.view ? applyView() : fitView(false);
  save(true);
  const days = S.lastExport ? Math.floor((Date.now() - S.lastExport) / 864e5) : null;
  if (days === null || days >= 21)
    setTimeout(() => toast(days === null ? T("tipBackup") : T("lastBackup", days),
                           T("exportNow"), exportJson), 2500);
  if (!storageOK) {
    const w = document.createElement("div");
    w.className = "warn";
    w.textContent = T("storageWarn");
    document.body.appendChild(w);
  }
})();
